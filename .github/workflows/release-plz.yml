name: Release-plz

on:
  push:
    branches: [main]

jobs:
  # Open or update a release PR with version bump + changelog
  # based on conventional commits since the last tag.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Rust toolchain channel
        id: rust-toolchain
        run: |
          channel=$(grep '^channel' crates/twitch-1337/rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Run release-plz (release-pr)
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
        env:
          # PAT (RELEASE_PLZ_TOKEN) so the PR is authored by a real identity
          # and downstream workflows can be triggered on merge.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # When the release PR is merged, tag the release and publish a GitHub release.
  # The tag push triggers .github/workflows/docker.yml.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # PAT must persist so `git push <tag>` fires downstream workflows.
          # GITHUB_TOKEN-pushed tags do not trigger other workflows.
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Read Rust toolchain channel
        id: rust-toolchain
        run: |
          channel=$(grep '^channel' crates/twitch-1337/rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Run release-plz (release)
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
