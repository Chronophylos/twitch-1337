name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly re-scan of the deployed :latest: advisories land against an
  # unchanged image too. Only the `scan` job runs on schedule.
  schedule:
    - cron: '0 5 * * 0'  # Sundays 05:00 UTC, after ghcr-retention at 04:00

concurrency:
  # Scheduled scans get their own group. GitHub keeps one pending run per
  # group, so a queued scan would otherwise replace a queued build and that
  # push would never deploy.
  group: docker-${{ github.event_name == 'schedule' && 'scheduled-scan' || github.ref }}
  # Queue, never cancel: a docs-only push cancelling an in-flight code build
  # would skip its own build too, and that code would never deploy.
  cancel-in-progress: false

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so github.event.before is already local. paths-filter
      # otherwise git-fetches that SHA, which needs credentials; persist-credentials
      # is false (zizmor artipacked) and unauthenticated fetch only works on public repos.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  build:
    name: build and push
    needs: changes
    # Ref gate: workflow_dispatch on a non-main branch must not publish
    # :latest (the dockhand webhook would deploy it past all required checks).
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
      DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/chronophylos/twitch-1337
          tags: |
            type=raw,value=latest
            type=raw,value=b${{ github.run_number }}
          # metadata-action derives these from repo metadata, which would
          # override the Dockerfile LABELs: description from the repo blurb,
          # licenses from GitHub's detection (Apache-2.0 only), version from
          # the first tag (latest). Keep them in sync with the Dockerfile.
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=b${{ github.run_number }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=b${{ github.run_number }}
        env:
          IMAGE_DESCRIPTION: "A Twitch bot for one channel, with a mind of its own: the 13:37 race, AI chat, flight tracking, alerts and a web dashboard. One static Rust binary, FROM scratch."

      - name: Set image created timestamp
        run: echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: push
        uses: docker/build-push-action@v7.4.0
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_NUM: b${{ github.run_number }}
          CREATED: ${{ env.CREATED }}
        with:
          context: .
          push: true
          # No attestation manifests: each one is an extra untagged GHCR
          # version, which eats into ghcr-retention's keep-30 window.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHCR reads the package description from manifest annotations,
          # not config labels, for OCI manifests.
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            BUILD_NUM=${{ env.BUILD_NUM }}
            CREATED=${{ env.CREATED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell dockhand the new :latest is live so it pulls + redeploys.
      # Fires only after a successful push; no-ops if the secret is unset.
      # Auth: GitLab-style plain token header (X-Gitlab-Token). Configure the
      # dockhand stack webhook with the matching secret, and enable
      # force-redeploy there — a :latest push is not a new git commit, so
      # without it dockhand returns {"skipped":true} and never restarts.
      # URL + secret stay in env so they never land in a `${{ }}`-expanded
      # run line or the step log.
      - name: Trigger dockhand redeploy
        if: ${{ env.DOCKHAND_WEBHOOK_URL != '' }}
        # dockhand answers HTTP 200 even when the compose pull fails, so
        # -f alone never trips; check the body.
        run: |
          resp=$(curl -fsS -X POST \
            -H "X-Gitlab-Token: $DOCKHAND_WEBHOOK_SECRET" \
            "$DOCKHAND_WEBHOOK_URL")
          echo "$resp"
          jq -e '.success != false and .skipped != true' <<<"$resp" >/dev/null

  scan:
    name: trivy image
    needs: build
    # After a push: scan the exact digest `build` just published, so a later
    # :latest cannot race it. On schedule `build` is skipped; re-scan the
    # deployed :latest against the current advisory DB.
    if: always() && (github.event_name == 'schedule' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    # Same set as sast.yml trivy-config: upload-sarif polls the run
    # (actions: read) and writes the Security tab (security-events: write).
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Locked at v0.36.0, same as sast.yml trivy-config (Mar 2026 supply-chain
      # incident). The GHCR package is public, so Trivy pulls anonymously.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/chronophylos/twitch-1337${{ github.event_name == 'schedule' && ':latest' || format('@{0}', needs.build.outputs.digest) }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          # The action drops `severity` for SARIF unless this is set, and
          # exit-code would then trip on LOW/MEDIUM findings too.
          limit-severities-for-sarif: true
          # Fixable findings only: an advisory without a patched release has
          # nothing to bump, and a red run would only train people to ignore it.
          ignore-unfixed: true
          # Fail on findings: the run going red (and the failure email on the
          # weekly schedule) is the alert. The image is already deployed, so
          # this never blocks a release.
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: always() && !github.event.repository.private
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
