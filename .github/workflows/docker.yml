name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  build:
    name: build and push
    needs: changes
    # Ref gate: workflow_dispatch on a non-main branch must not publish
    # :latest (the dockhand webhook would deploy it past all required checks).
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
      DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/chronophylos/twitch-1337
          tags: |
            type=raw,value=latest
            type=raw,value=b${{ github.run_number }}

      - name: Set image created timestamp
        run: echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_NUM: b${{ github.run_number }}
          CREATED: ${{ env.CREATED }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            BUILD_NUM=${{ env.BUILD_NUM }}
            CREATED=${{ env.CREATED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell dockhand the new :latest is live so it pulls + redeploys.
      # Fires only after a successful push; no-ops if the secret is unset.
      # Auth: GitLab-style plain token header (X-Gitlab-Token). Configure the
      # dockhand stack webhook with the matching secret, and enable
      # force-redeploy there — a :latest push is not a new git commit, so
      # without it dockhand returns {"skipped":true} and never restarts.
      # URL + secret stay in env so they never land in a `${{ }}`-expanded
      # run line or the step log.
      - name: Trigger dockhand redeploy
        if: ${{ env.DOCKHAND_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST \
            -H "X-Gitlab-Token: $DOCKHAND_WEBHOOK_SECRET" \
            "$DOCKHAND_WEBHOOK_URL"
