name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly audit: advisories land against an unchanged Cargo.lock too.
  schedule:
    - cron: '0 5 * * 1'  # Mondays 05:00 UTC

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Only supersede PR runs; every main push keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so github.event.before is already local. paths-filter
      # otherwise git-fetches that SHA, which needs credentials; persist-credentials
      # is false (zizmor artipacked) and unauthenticated fetch only works on public repos.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  fmt:
    name: fmt
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # rustup installs the channel + components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # docs/observability.md span rule 5: a bare `#[instrument]` Debug-dumps
      # every argument (payloads, secrets). perl slurps each file so a
      # multi-line attribute is matched whole; balanced parens (skipping
      # string literals) find its end, and strings are stripped before
      # looking for a top-level `skip_all` argument.
      - name: '#[instrument] uses skip_all'
        run: |
          # shellcheck disable=SC2016 # $ belongs to perl, not the shell
          git ls-files -z '*.rs' | xargs -0 -r perl -0777 -ne '
            while (/#\[(?:tracing::)?instrument\b\s*(\((?:[^()"]++|"(?:[^"\\]|\\.)*+"|(?1))*\))?/g) {
              my ($at, $args) = ($-[0], $1 // "");
              (my $bare = $args) =~ s/"(?:[^"\\]|\\.)*"//g;
              next if $bare =~ /[(,]\s*skip_all\s*[,)]/;
              my $line = 1 + (substr($_, 0, $at) =~ tr/\n//);
              print "$ARGV:$line: #[instrument] without skip_all\n";
              $bad = 1;
            }
            END { exit($bad ? 1 : 0) }
          '

      # rustup installs the channel + components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Broken intra-doc links. Private links are fine: docs are internal-only.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-machete

      - name: cargo machete (unused deps)
        run: cargo machete

  test:
    name: test
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # rustup installs the channel + components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest

      - name: cargo llvm-cov nextest
        # --no-clean keeps rust-cache's restored target/; default clean would
        # wipe it. This job only ever runs llvm-cov, so artifacts stay consistent.
        run: cargo llvm-cov nextest --locked --no-clean --workspace --lcov --output-path lcov.info

      - name: Test report
        if: (success() || failure()) && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6.7.1
        with:
          report_paths: target/nextest/ci/junit.xml
          job_name: test
          update_check: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          detailed_summary: true
          failed_summary_logs: true
          fail_on_failure: false

      - name: Coverage summary
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          jq -r '
            "## Coverage\n",
            "| Metric | Covered | Total | Coverage |",
            "| --- | ---: | ---: | ---: |",
            (.data[0].totals
              | to_entries[]
              | select(.key == "functions" or .key == "lines" or .key == "regions")
              | "| \(.key | ascii_upcase) | \(.value.covered) | \(.value.count) | \(.value.percent * 100 | round / 100)% |")
          ' coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  e2e:
    name: e2e
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # rustup installs the channel + components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install nextest
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest

      # install-chromedriver: true guarantees the chromedriver matches whatever chrome resolves to
      - id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: '149'
          install-chromedriver: true
          install-dependencies: true

      - name: Start chromedriver
        env:
          # Pass the output via env (not inline ${{ }}) so the value can't be
          # expanded into the shell script — zizmor template-injection rule.
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROMEDRIVER_PATH" --port=9515 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9515/status >/dev/null && break
            sleep 0.3
          done
          curl -sf http://localhost:9515/status >/dev/null || { echo "chromedriver did not start"; exit 1; }

      - name: cargo nextest (e2e)
        env:
          WEBDRIVER_URL: http://localhost:9515
          # Point chromedriver at the setup-chrome-installed browser so its
          # version matches the installed chromedriver (the runner's
          # preinstalled Chrome may differ).
          E2E_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo nextest run -p twitch-1337-web --features e2e

      - name: Test report
        if: (success() || failure()) && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6.7.1
        with:
          report_paths: target/nextest/ci/junit.xml
          job_name: e2e
          update_check: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          detailed_summary: true
          failed_summary_logs: true
          fail_on_failure: false

  deny:
    # Advisories (RustSec), bans (aws-lc-sys, ADR-0007), licenses and sources; see deny.toml.
    name: cargo deny
    needs: changes
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources
