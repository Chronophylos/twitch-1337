name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so github.event.before is already local. paths-filter
      # otherwise git-fetches that SHA, which needs credentials; persist-credentials
      # is false (zizmor artipacked) and unauthenticated fetch only works on public repos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  fmt:
    name: fmt
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Channel comes from rust-toolchain.toml at the repo root.
      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ADR-0007: ring-only rustls. aws-lc-sys must stay out of the graph
      # (including test/dev deps) so musl/`FROM scratch` stays cmake-free and
      # rustls never sees dual crypto providers.
      - name: Forbid aws-lc-sys
        run: |
          if cargo tree --workspace --all-targets -i aws-lc-sys >/dev/null 2>&1; then
            echo "aws-lc-sys must not appear in the dependency graph (ADR-0007)" >&2
            cargo tree --workspace --all-targets -i aws-lc-sys >&2
            exit 1
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov # zizmor: ignore[unpinned-uses]

      - name: Install nextest
        uses: taiki-e/install-action@nextest # zizmor: ignore[unpinned-uses]

      - name: cargo llvm-cov nextest
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  e2e:
    name: e2e
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master # zizmor: ignore[unpinned-uses]

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        uses: taiki-e/install-action@nextest # zizmor: ignore[unpinned-uses]

      # install-chromedriver: true guarantees the chromedriver matches whatever chrome resolves to
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: '149'
          install-chromedriver: true
          install-dependencies: true

      - name: Start chromedriver
        env:
          # Pass the output via env (not inline ${{ }}) so the value can't be
          # expanded into the shell script — zizmor template-injection rule.
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROMEDRIVER_PATH" --port=9515 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9515/status >/dev/null && break
            sleep 0.3
          done
          curl -sf http://localhost:9515/status >/dev/null || { echo "chromedriver did not start"; exit 1; }

      - name: cargo nextest (e2e)
        env:
          WEBDRIVER_URL: http://localhost:9515
          # Point chromedriver at the setup-chrome-installed browser so its
          # version matches the installed chromedriver (the runner's
          # preinstalled Chrome may differ).
          E2E_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo nextest run -p twitch-1337-web --features e2e

  audit:
    name: cargo audit
    needs: changes
    if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
