name: Data refresh

on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    name: regenerate CSVs and open PR
    runs-on: ubuntu-latest
    # All writes go through DATA_REFRESH_PAT; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DATA_REFRESH_PAT }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Regenerate airlines.csv
        run: bash scripts/generate_airlines_csv.sh

      - name: Regenerate airports.csv
        run: uv run scripts/update-airports.py

      - name: Regenerate plz.csv
        run: uv run scripts/update-plz.py

      - name: Regenerate flight OurAirports CSVs
        run: bash scripts/update-ourairports.sh

      - name: Count rows for PR body
        id: counts
        run: |
          {
            echo "airlines=$(wc -l < crates/data/assets/location/airlines.csv)"
            echo "airports=$(wc -l < crates/data/assets/location/airports.csv)"
            echo "plz=$(wc -l < crates/data/assets/location/plz.csv)"
            echo "oa_airports=$(wc -l < crates/data/assets/flight/ourairports/airports.csv)"
            echo "oa_runways=$(wc -l < crates/data/assets/flight/ourairports/runways.csv)"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.DATA_REFRESH_PAT }}
          branch: chore/data-refresh
          title: 'chore(data): refresh CSVs'
          commit-message: 'chore(data): refresh CSVs'
          body: |
            Automated weekly refresh of public-dataset CSVs.

            **Row counts**
            - `crates/data/assets/location/airlines.csv`: ${{ steps.counts.outputs.airlines }} rows
            - `crates/data/assets/location/airports.csv`: ${{ steps.counts.outputs.airports }} rows
            - `crates/data/assets/location/plz.csv`: ${{ steps.counts.outputs.plz }} rows
            - `crates/data/assets/flight/ourairports/airports.csv`: ${{ steps.counts.outputs.oa_airports }} rows
            - `crates/data/assets/flight/ourairports/runways.csv`: ${{ steps.counts.outputs.oa_runways }} rows

            Merge if the diff looks reasonable. If CI fails, a parser likely
            needs to be adjusted for an upstream schema change.
          delete-branch: true
