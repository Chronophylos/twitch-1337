name: SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

# Public repos implied `actions: read` (codeql-action polls the workflow run)
# and PR-commit listing. A private GITHUB_TOKEN does not — request them.
# SARIF upload also needs GitHub Advanced Security, which personal private
# repos do not have; skip the upload there. Findings fail the job either way:
# these are required checks, and the Security tab alone would not block a merge.
jobs:
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          # Fail on findings; the upload step below still runs (`always()`).
          no-fail: false

      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: always() && !github.event.repository.private
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  trivy-config:
    name: trivy config (IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Locked at v0.36.0. The Mar 2026 supply-chain incident compromised
      # trivy-action tags <= v0.34.2; actions.lock records the exact commit
      # instead of trusting a mutable tag.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          # Same rule as hadolint: fail on findings, upload regardless.
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: always() && !github.event.repository.private
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install + run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: ${{ !github.event.repository.private }}

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
