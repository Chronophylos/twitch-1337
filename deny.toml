# cargo-deny: advisories (RustSec), bans, licenses, sources.

[graph]
all-features = true

[advisories]
ignore = [
    # basic-toml unmaintained: build-time only via askama_derive (reads askama config),
    # never parses user input, no patched version. Drop once askama moves to `toml`.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via askama_derive" },
    # bashkit — the `!bash` sandbox interpreter — depends on chrono
    # unconditionally and offers no jiff/time build; the advisory is
    # unmaintained-only (no CVE) and no upgrade path exists. The bot's own time
    # handling stays on jiff. Drop once bashkit stops pulling chrono.
    { id = "RUSTSEC-2026-0543", reason = "mandatory transitive dep of bashkit" },
]

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft, unmodified upstream
# sources). Keep the list minimal: an entry no dependency needs warns as unused.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Workspace crates are `publish = false`.
ignore = true

[bans]
# Duplicate majors are routine transitive churn; advisories catch the ones
# that matter (an old major with a CVE).
multiple-versions = "allow"
deny = [
    # ADR-0007: ring-only rustls. aws-lc-sys must stay out of the graph so the
    # musl `FROM scratch` build stays cmake-free and rustls has one provider.
    { crate = "aws-lc-sys", reason = "ADR-0007: ring-only rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Own fork, pinned by rev in crates/{core,twitch-1337}/Cargo.toml.
allow-git = ["https://github.com/Chronophylos/twitch-irc-rs"]
