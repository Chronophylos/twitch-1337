# cargo-deny: advisories (RustSec), bans, sources. Licenses are not checked:
# private bot, nothing is redistributed.

[graph]
all-features = true

[advisories]
ignore = [
    # basic-toml unmaintained: build-time only via askama_derive (reads askama config),
    # never parses user input, no patched version. Drop once askama moves to `toml`.
    { id = "RUSTSEC-2026-0374", reason = "build-time only via askama_derive" },
    # chrono family declared unmaintained (chronotope/chrono#1768), all versions,
    # no patched release, no CVE. Stopgap until the jiff migration lands: #609.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no CVE; jiff migration tracked in #609" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no CVE; jiff migration tracked in #609" },
    { id = "RUSTSEC-2026-0542", reason = "humantime (via humantime-serde) unmaintained, no CVE; jiff migration tracked in #609" },
]

[bans]
# Duplicate majors are routine transitive churn; advisories catch the ones
# that matter (an old major with a CVE).
multiple-versions = "allow"
deny = [
    # ADR-0007: ring-only rustls. aws-lc-sys must stay out of the graph so the
    # musl `FROM scratch` build stays cmake-free and rustls has one provider.
    { crate = "aws-lc-sys", reason = "ADR-0007: ring-only rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Own fork, pinned by rev in crates/{core,twitch-1337}/Cargo.toml.
allow-git = ["https://github.com/Chronophylos/twitch-irc-rs"]
