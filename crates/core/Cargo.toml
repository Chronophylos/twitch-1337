[package]
name = "twitch-1337-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Each tests/*.rs file is its own crate (recompiles TestBotBuilder every time).
# Explicit [[test]] targets group by domain instead. See
# docs/superpowers/specs/2026-08-31-group-integration-tests-design.md
autotests = false

[features]
testing = []

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
color-eyre = { workspace = true }
eyre = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
humantime-serde = { workspace = true }
indexmap = { workspace = true }
infer = { workspace = true }
jiff = { workspace = true }
llm = { path = "../llm" }
minijinja = { version = "3.1.0", default-features = false, features = [
  "builtins",
  "serde",
] }
random-flight = { path = "../random-flight" }
rand = { workspace = true }
reqwest = { workspace = true }
ron = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
schemars = { workspace = true }
scraper = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
twitch-1337-data = { path = "../data" }
tracing = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
twitch-irc = { git = "https://github.com/Chronophylos/twitch-irc-rs", rev = "515e259d33b7ba8b0108e5d3f1364ddd40a705ab", default-features = false, features = [
  "refreshing-token-rustls-webpki-roots",
  "transport-tcp-rustls-webpki-roots",
] }
url.workspace = true

[dev-dependencies]
twitch-1337-core = { path = ".", features = ["testing"] }
twitch-1337-web = { path = "../web" }
async-trait = "0.1"
bytes = "1"
either = "1"
reqwest = { workspace = true }
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tower-cookies = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true

[[test]]
name = "ai"
path = "tests/ai/main.rs"

[[test]]
name = "aviation"
path = "tests/aviation/main.rs"

[[test]]
name = "tracker"
path = "tests/tracker/main.rs"

[[test]]
name = "irc"
path = "tests/irc/main.rs"

# humantime_serde is only named inside #[serde(with = "...")], which machete can't see.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
