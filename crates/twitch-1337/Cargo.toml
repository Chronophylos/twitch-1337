[package]
name = "twitch-1337"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
color-eyre = { workspace = true }
eyre = { workspace = true }
jiff = { workspace = true }
mimalloc = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
twitch-1337-core = { path = "../core" }
twitch-1337-web = { path = "../web" }
twitch-irc = { git = "https://github.com/Chronophylos/twitch-irc-rs", rev = "2d3d85bbe07c4609985f427680187413aa7732fa", default-features = false, features = [
  "refreshing-token-rustls-webpki-roots",
  "transport-tcp-rustls-webpki-roots",
] }

[features]
