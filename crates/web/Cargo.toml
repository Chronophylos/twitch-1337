[package]
name = "twitch-1337-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Same integration-test tax as core: group route/auth tests so helpers/
# compiles twice instead of ~22 times. e2e stays its own gated target.
autotests = false

[dependencies]
twitch-1337-core = { path = "../core" }
arc-swap = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
mime_guess = { workspace = true }
rand = { workspace = true }
ron = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-cookies = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
tower-livereload = { version = "0.10", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }

[features]
# Mounts `/_dev/login` on the public router for local development. NEVER
# compile this into a production binary — anyone reaching the bind addr
# can mint a moderator session without OAuth.
dev-login = ["dep:tower-livereload", "dep:notify-debouncer-mini"]

# Compile-gate for the browser e2e test target (crates/web/tests/e2e.rs):
# without `--features e2e` the e2e test binary is not built or run. The CI
# `e2e` job and `just e2e` pass it. (Note: `fantoccini` is a plain dev-dep, so
# it still compiles for any web-crate test build — only the e2e *target* is
# gated.)
e2e = []

# Test-only fixture surface (`WebState::for_tests` / `WebTestConfig`). Mirrors
# the core crate's pattern: the self dev-dependency below turns it on for this
testing = ["twitch-1337-core/testing"]

# Standalone dashboard runner — skips IRC, uses StubHelix.
# `cargo run -p twitch-1337-web --bin web-dev --features dev-login`
[[bin]]
name = "web-dev"
path = "src/bin/web_dev.rs"
required-features = ["dev-login"]

[dev-dependencies]
twitch-1337-web = { path = ".", features = ["testing"] }
arc-swap = { workspace = true }
# HTTP-only WebDriver (chromedriver on http://localhost). Avoid rustls-tls /
# native-tls — hyper-rustls defaults pull aws-lc-rs into the workspace graph.
fantoccini = { version = "0.22", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true

[[test]]
name = "auth"
path = "tests/auth/main.rs"

[[test]]
name = "routes"
path = "tests/routes/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]
