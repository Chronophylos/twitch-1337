{# crates/web/templates/settings/_macros.html
   Shared row macros for settings cards. Import with:
       {% import "settings/_macros.html" as m %}
   then call e.g. {% call m::num_row_bounded(...) %}{% endcall %}.

   Every row control carries `id="{{ field }}"` and the row key is a
   `<label for>` pointing at it, so each input's accessible name is its key.
#}

{% macro nav_group_head(group_id, label, count) %}
<button type="button" class="settings-nav-group-head" data-group-toggle="{{ group_id }}" aria-expanded="true" aria-controls="nav-group-body-{{ group_id }}">
  <span class="chev" aria-hidden="true">▸</span>
  <span class="lbl">{{ label }}</span>
  <span class="meta">
    <span class="count" aria-label="{{ count }} sections">{{ count }}</span>
    <span class="gdirty" hidden aria-label="Group has unsaved changes">0</span>
  </span>
</button>
{% endmacro %}

{% macro nav_section_item(slug, target, label) %}
<li>
  <a href="#sec-{{ slug }}" class="settings-nav-item" data-target="{{ target }}">
    <span class="dot" aria-hidden="true"></span>
    <span class="lbl">{{ label }}</span>
    <span class="ndirty" hidden>0</span>
  </a>
</li>
{% endmacro %}

{# `for_id` + `for_suffix` is the id of the row's visible control. #}
{% macro row_head(key, hint, for_id, for_suffix = "") %}
<div class="row-left">
  <div class="row-label">
    <span class="dirty-dot" aria-hidden="true"></span>
    <label for="{{ for_id }}{{ for_suffix }}"><code class="row-key">{{ key }}</code></label>
  </div>
  <div class="row-hint">{{ hint }}</div>
</div>
{% endmacro %}

{% macro row_reset(key) %}
<button
  type="button"
  class="row-reset"
  title="Reset to default"
  aria-label="Reset {{ key }} to default"
  hidden>↺</button>
{% endmacro %}

{% macro toggle_row(section, field, key, hint, value, default) %}
<div class="settings-row" data-section="{{ section }}">
  {% call row_head(key, hint, field) %}{% endcall %}
  <div class="row-control-cell">
    <label class="toggle">
      <input
        type="checkbox"
        id="{{ field }}"
        name="{{ field }}"
        value="1"
        data-default="{{ default }}"
        data-key="{{ key }}"
        role="switch"
        {% if value %}checked{% endif %}>
      <span class="toggle-thumb" aria-hidden="true"></span>
    </label>
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono">{% if default %}on{% else %}off{% endif %}</span></span>
  </div>
</div>
{% endmacro %}

{# Numeric row with caller-supplied bounds. `unit` is shown beside the
   input and after the default; empty means unitless. #}
{% macro num_row_bounded(section, field, key, hint, value, default, unit, min, max, enabled_by = "") %}
<div class="settings-row" data-section="{{ section }}"{% if !enabled_by.is_empty() %} data-card-enabled-by="{{ enabled_by }}"{% endif %}>
  {% call row_head(key, hint, field) %}{% endcall %}
  <div class="row-control-cell">
    <div class="num-wrap">
      <input
        type="number"
        class="num-input"
        id="{{ field }}"
        name="{{ field }}"
        min="{{ min }}"
        max="{{ max }}"
        value="{{ value }}"
        data-default="{{ default }}"
        data-key="{{ key }}">
      {% if !unit.is_empty() %}<span class="num-unit">{{ unit }}</span>{% endif %}
    </div>
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono">{{ default }}{% if !unit.is_empty() %}{{ unit }}{% endif %}</span></span>
  </div>
</div>
{% endmacro %}

{# Generic free-text row (URLs, paths). `placeholder` shows when the value
   is empty. #}
{% macro text_row(section, field, key, hint, value, default, placeholder, enabled_by = "") %}
<div class="settings-row" data-section="{{ section }}"{% if !enabled_by.is_empty() %} data-card-enabled-by="{{ enabled_by }}"{% endif %}>
  {% call row_head(key, hint, field) %}{% endcall %}
  <div class="row-control-cell">
    <input type="text"
           class="text-input is-wide"
           id="{{ field }}"
           name="{{ field }}"
           value="{{ value }}"
           placeholder="{{ placeholder }}"
           data-default="{{ default }}"
           data-key="{{ key }}">
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono">{% if default.is_empty() %}(empty){% else %}{{ default }}{% endif %}</span></span>
  </div>
</div>
{% endmacro %}

{# Time-of-day row for `HH:MM` strings (Berlin wallclock). #}
{% macro time_row(section, field, key, hint, value, default, enabled_by = "") %}
<div class="settings-row" data-section="{{ section }}"{% if !enabled_by.is_empty() %} data-card-enabled-by="{{ enabled_by }}"{% endif %}>
  {% call row_head(key, hint, field) %}{% endcall %}
  <div class="row-control-cell">
    <input type="time"
           class="text-input is-narrow"
           id="{{ field }}"
           name="{{ field }}"
           value="{{ value }}"
           data-default="{{ default }}"
           data-key="{{ key }}">
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono">{{ default }}</span></span>
  </div>
</div>
{% endmacro %}

{# Slider row for 0..=1 floats (rendered as percentage). #}
{% macro range_row(section, field, key, hint, value, default, enabled_by = "") %}
<div class="settings-row" data-section="{{ section }}"{% if !enabled_by.is_empty() %} data-card-enabled-by="{{ enabled_by }}"{% endif %}>
  {% call row_head(key, hint, field) %}{% endcall %}
  <div class="row-control-cell">
    <div class="range-wrap">
      <input type="range"
             min="0" max="1" step="0.05"
             id="{{ field }}"
             name="{{ field }}"
             value="{{ value }}"
             data-default="{{ default }}"
             data-key="{{ key }}">
      <span class="range-value" data-range-value>{{ value }}</span>
    </div>
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono">{{ default }}</span></span>
  </div>
</div>
{% endmacro %}

{# `bytes` and `default_bytes` are raw u64. The hidden input posts the
   canonical integer — `ByteSize::from_str` (server side) accepts it, and
   `Deserialize<Option<usize>>` does too — so this macro covers both
   ByteSize-typed (ai.media) and usize-typed (ai.memory) fields. The visible
   amount + default label are rendered from JS on init via formatBytesIec. #}
{% macro bytesize_row(section, field, key, hint, bytes, default_bytes) %}
<div class="settings-row" data-section="{{ section }}" data-bytes-row>
  {% call row_head(key, hint, field, "_display") %}{% endcall %}
  <div class="row-control-cell">
    <div class="bytes-wrap">
      <input
        type="number"
        class="num-input bytes-display"
        id="{{ field }}_display"
        min="0"
        step="any"
        value="">
      <div class="bytes-units" role="group" aria-label="{{ key }} unit">
        <button type="button" class="bytes-unit" data-unit="B" aria-pressed="false">B</button>
        <button type="button" class="bytes-unit" data-unit="KiB" aria-pressed="false">KiB</button>
        <button type="button" class="bytes-unit" data-unit="MiB" aria-pressed="false">MiB</button>
      </div>
      <input type="hidden"
             class="bytes-canonical"
             name="{{ field }}"
             value="{{ bytes }}"
             data-default="{{ default_bytes }}"
             data-key="{{ key }}">
    </div>
  </div>
  <div class="row-right">
    {% call row_reset(key) %}{% endcall %}
    <span class="row-default">default <span class="mono" data-bytes-default="{{ default_bytes }}">{{ default_bytes }}</span></span>
  </div>
</div>
{% endmacro %}
