[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/data",
    "crates/llm",
    "crates/random-flight",
    "crates/settings-derive",
    "crates/twitch-1337",
    "crates/web",
]

[workspace.package]
# Pinned: this project uses a rolling release model (see
# docs/superpowers/specs/2026-05-26-rolling-release-design.md). Version
# bumps serve no audience — the running build identifies itself via
# BUILD_NUM + GIT_SHA in the dashboard sidebar and startup log. Do not
# bump this field.
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
arc-swap = "1.9"
askama = { version = "0.16", features = ["urlencode"] }
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio", "tower-log", "tracing"] }
# serde_html_form-backed Form extractor: parses repeated urlencoded keys into
# Vec and a single occurrence into a 1-element Vec (plain axum::Form/serde_urlencoded
# rejects a lone `calendar_days=Thu` as "expected a sequence").
axum-extra = { version = "0.12", default-features = false, features = ["form"] }
base64 = "0.23"
bytesize = { version = "2", features = ["serde"] }
color-eyre = "0.6"
csv = "1.4.0"
eyre = "0.6.14"
futures-util = "0.3"
hex = "0.4"
indexmap = { version = "2.14", features = ["serde"] }
infer = { version = "0.22", default-features = false }
# Bundled IANA DB: the musl FROM-scratch image has no /usr/share/zoneinfo, and
# Aviationstack airport timezones must resolve.
jiff = { version = "1.0.1", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
tokio-util = "0.7"
# Sync mutexes: no lock poisoning, so lock sites need no `expect` (ADR-0012).
parking_lot = "0.12"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
ron = "0.12.3"
rusqlite = { version = "0.42", features = ["bundled"] }
rust-embed = { version = "8", features = ["axum-ex"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = { version = "1.2", features = ["derive"] }
scraper = "0.29"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1.2.1"
tower = { version = "0.5", features = ["util"] }
tower-cookies = { version = "0.11", features = ["signed", "private"] }
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
mime_guess = "2"
urlencoding = "2"
time = "0.3"
wiremock = "0.6"

[profile.release]
# Drop .symtab/.strtab from the musl static binary (~8 MiB). The scratch
# image is essentially just this binary, so strip directly caps image size.
strip = "symbols"

[workspace.lints.clippy]
cast_lossless = "warn"
implicit_clone = "warn"
needless_continue = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
# Debug leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
# tokio: flag futures big enough to blow task stacks.
large_futures = "warn"
# Suppressions must be #[expect(..., reason = "...")] so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
# ADR-0012 rules 9-10: panics only for proven invariants or baked data; tests
# opt out via clippy.toml. Surviving sites carry #[expect(lint, reason)].
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
