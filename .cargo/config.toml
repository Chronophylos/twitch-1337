# chrono-tz: do not filter to Berlin-only. Aviationstack airport `timezone`
# fields (e.g. Asia/Karachi) must resolve so local wall times stamped as
# +00:00 can be reinterpreted to real UTC. Bot scheduling still uses Berlin.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
