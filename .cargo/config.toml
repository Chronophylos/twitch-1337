# chrono-tz: do not filter to Berlin-only. Aviationstack airport `timezone`
# fields (e.g. Asia/Karachi) must resolve so local wall times stamped as
# +00:00 can be reinterpreted to real UTC. Bot scheduling still uses Berlin.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Built-in `debug` profile (inherits dev); full debuginfo for debugger sessions.
[profile.debug]
debug = true

# Supply-chain cooldown: resolve only versions published at least 7 days ago.
[registry]
global-min-publish-age = "7 days"
